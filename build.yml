name: Build ScriptedHardcore JAR

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Plugin bauen
        run: gradle build --no-daemon

      - name: Fertige JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ScriptedHardcore-1.2.0
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
